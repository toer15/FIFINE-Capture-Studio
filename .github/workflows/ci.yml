name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore FIFINE.CaptureStudio.sln

      - name: Build
        run: dotnet build FIFINE.CaptureStudio.sln -c Release --no-restore

      - name: Install FFmpeg (console stream decode test)
        run: choco install ffmpeg -y --no-progress

      - name: Test
        run: dotnet test tests/FifineCaptureStudio.Tests/FifineCaptureStudio.Tests.csproj -c Release --logger "console;verbosity=normal"

      # The `--smoke` view check needs an interactive desktop (WPF window rendering); hosted
      # Windows runners are headless, so it runs locally instead: see README "Verification".

      # Ordinary pushes only prove the code builds and passes tests. Releases come from tags.
