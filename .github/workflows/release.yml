name: Release

# A tag is the only thing that publishes an official release. Normal pushes run CI only.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 8 SDK (app) and .NET 10 runtime (Velopack CLI)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') {
            throw "Tag '$tag' is not a semantic version tag such as v1.0.1 or v1.1.0-beta.1"
          }
          $version = $Matches[1]
          $prerelease = $version.Contains('-') ? "true" : "false"
          "VERSION=$version" >> $env:GITHUB_ENV
          "IS_PRERELEASE=$prerelease" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          Write-Host "Releasing version $version (prerelease=$prerelease)"

      - name: Restore
        run: dotnet restore FIFINE.CaptureStudio.sln

      - name: Build (Release)
        run: dotnet build FIFINE.CaptureStudio.sln -c Release --no-restore -p:Version=${{ env.VERSION }}

      - name: Run automated tests
        run: dotnet test tests/FifineCaptureStudio.Tests/FifineCaptureStudio.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Verify the build reports the tagged version
        shell: pwsh
        run: |
          $exe = "src/FifineCaptureStudio/bin/Release/net8.0-windows/FifineCaptureStudio.exe"
          $info = (Get-Item $exe).VersionInfo
          Write-Host "File version: $($info.FileVersion)  Product: $($info.ProductVersion)"
          if ($info.ProductVersion -notlike "${{ env.VERSION }}*") {
            throw "Built product version '$($info.ProductVersion)' does not match tag version '${{ env.VERSION }}'"
          }

      - name: Publish self-contained win-x64
        run: >
          dotnet publish src/FifineCaptureStudio/FifineCaptureStudio.csproj
          -c Release -r win-x64 --self-contained true -p:Version=${{ env.VERSION }}
          -p:PublishSingleFile=false -o publish

      - name: Smoke test all views
        shell: pwsh
        run: |
          & "./publish/FifineCaptureStudio.exe" --smoke
          $report = "$env:LOCALAPPDATA/FifineCaptureStudioData/smoke.txt"
          Get-Content $report
          if (Select-String -Path $report -Pattern 'FAIL' -Quiet) { exit 1 }

      - name: Generate release notes
        shell: pwsh
        run: |
          $previous = git describe --tags --abbrev=0 "HEAD^" 2>$null
          $range = if ($previous) { "$previous..HEAD" } else { "HEAD" }
          "## FIFINE Capture Studio $env:VERSION" | Out-File -Encoding utf8 release-notes.md
          "" | Out-File -Append -Encoding utf8 release-notes.md
          git log --no-merges --pretty=format:"- %s" $range | Out-File -Append -Encoding utf8 release-notes.md
          "" | Out-File -Append -Encoding utf8 release-notes.md
          "Windows x64 · Velopack installer and update packages." | Out-File -Append -Encoding utf8 release-notes.md

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk

      - name: Download the previous release (for delta packages)
        continue-on-error: true
        shell: pwsh
        run: |
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}"

      - name: Package with Velopack
        shell: pwsh
        run: |
          vpk pack `
            --packId FifineCaptureStudio `
            --packVersion "${{ env.VERSION }}" `
            --packDir publish `
            --mainExe FifineCaptureStudio.exe `
            --packTitle "FIFINE Capture Studio" `
            --packAuthors "FIFINE" `
            --icon "src/FifineCaptureStudio/Assets/fifine.ico" `
            --releaseNotes release-notes.md `
            --channel win `
            --outputDir Releases

      - name: Show generated packages and hashes
        shell: pwsh
        run: Get-ChildItem Releases | Select-Object Name, Length

      - name: Publish the GitHub release
        shell: pwsh
        run: |
          $args = @(
            "upload", "github",
            "--repoUrl", "https://github.com/${{ github.repository }}",
            "--token", "${{ secrets.GITHUB_TOKEN }}",
            "--publish",
            "--releaseName", "FIFINE Capture Studio ${{ env.VERSION }}",
            "--tag", "${{ env.RELEASE_TAG }}",
            "--merge"
          )
          if ("${{ env.IS_PRERELEASE }}" -eq "true") { $args += "--prerelease" }
          vpk @args

      - name: Keep release artefacts for auditing
        uses: actions/upload-artifact@v4
        with:
          name: velopack-${{ env.VERSION }}
          path: Releases/**
          retention-days: 30
